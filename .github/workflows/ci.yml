name: Application Server CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: application-server/package-lock.json

    - name: Install dependencies
      working-directory: application-server
      run: npm ci

    - name: Run automated test suite
      working-directory: application-server
      env:
        PORT: 5000
        NODE_ENV: test
        JWT_SECRET: ci_test_secret_key_12345
      run: npm test
