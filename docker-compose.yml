version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: retail_financial_postgres
    restart: always
    environment:
      POSTGRES_DB: retail_financial_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail_financial_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  application-server:
    build:
      context: ./application-server
      dockerfile: Dockerfile
    container_name: retail_financial_app_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/retail_financial_db
      JWT_SECRET: dev_jwt_secret_key_retail_planning_2026
      ML_SERVER_URL: http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
